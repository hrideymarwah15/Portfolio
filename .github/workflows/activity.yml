name: Update README with recent activity

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README with recent activity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JamesIves/github-activity-readme@v0.4.4
        with:
          COMMIT_MSG: 'chore: update activity section in README'
          MAX_LINES: 5
